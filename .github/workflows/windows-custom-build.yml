name: Windows Custom Build (Destek.exe)

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'Rendezvous Server IP / Host'
        required: false
        default: '130.61.69.181'
      server_key:
        description: 'Server Public Key'
        required: false
        default: 'ARtU1Y9FU869kBMyY0w8Yt3H9hlJHubpZWxUX2Jmzgc='
      permanent_password:
        description: 'Permanent Password for Unattended Access'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-destek:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest official RustDesk release
        shell: pwsh
        run: |
          $release = gh release view -R rustdesk/rustdesk --json tagName -q .tagName
          Write-Host "Latest official RustDesk release is $release"
          gh release download -R rustdesk/rustdesk -p "rustdesk-*-x86_64.exe" -D download_temp
          $exe = Get-ChildItem download_temp\rustdesk-*-x86_64.exe | Select-Object -First 1
          Move-Item $exe.FullName .\rustdesk-base.exe
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile Custom Destek.exe
        shell: pwsh
        run: |
          $hostIp = "${{ inputs.server_ip }}"
          if ([string]::IsNullOrWhiteSpace($hostIp)) {
            $hostIp = "${{ secrets.RENDEZVOUS_SERVER }}"
          }
          if ([string]::IsNullOrWhiteSpace($hostIp)) {
            $hostIp = "130.61.69.181"
          }

          $key = "${{ inputs.server_key }}"
          if ([string]::IsNullOrWhiteSpace($key)) {
            $key = "${{ secrets.RS_PUB_KEY }}"
          }
          if ([string]::IsNullOrWhiteSpace($key)) {
            $key = "ARtU1Y9FU869kBMyY0w8Yt3H9hlJHubpZWxUX2Jmzgc="
          }

          $pass = "${{ inputs.permanent_password }}"
          if ([string]::IsNullOrWhiteSpace($pass)) {
            $pass = "${{ secrets.PERMANENT_PASSWORD }}"
          }
          if ([string]::IsNullOrWhiteSpace($pass)) {
            $pass = "Gnn2922**"
          }

          Write-Host "Embedding Server Host: $hostIp"
          Write-Host "Embedding Server Key:  $key"
          Write-Host "Embedding Permanent Password..."

          $salt = "kcn9xw6tidzqj42w5prrmzhw8s9fva96"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($pass + $salt))
          $passHash = "00" + [System.Convert]::ToBase64String($hashBytes)

          $csharpCode = @"
          using System;
          using System.IO;
          using System.Diagnostics;
          using System.Reflection;

          namespace GNN_Destek
          {
              class Program
              {
                  const string Host = "$hostIp";
                  const string Key = "$key";
                  const string AppName = "rustdesk-qs-host=" + Host + ",key=" + Key + ".exe";
                  const string PasswordHash = "$passHash";
                  const string Salt = "$salt";

                  [STAThread]
                  static void Main(string[] args)
                  {
                      try
                      {
                          // 1. Setup RustDesk Config in %APPDATA%\RustDesk\config
                          string appData = Environment.GetFolderPath(Environment.SpecialFolder.ApplicationData);
                          string rustdeskConfigDir = Path.Combine(appData, "RustDesk", "config");
                          Directory.CreateDirectory(rustdeskConfigDir);

                          string rustdesk2Toml = Path.Combine(rustdeskConfigDir, "RustDesk2.toml");
                          string toml2Content = "rendezvous_server = '" + Host + ":21116'\n\n" +
                                                "[options]\n" +
                                                "custom-rendezvous-server = '" + Host + "'\n" +
                                                "key = '" + Key + "'\n" +
                                                "verification-method = 'use-permanent-password'\n" +
                                                "hide-network-settings = 'Y'\n" +
                                                "disable-change-permanent-password = 'Y'\n";
                          File.WriteAllText(rustdesk2Toml, toml2Content);

                          string rustdeskToml = Path.Combine(rustdeskConfigDir, "RustDesk.toml");
                          string toml1Content = "password = '" + PasswordHash + "'\n" +
                                                "salt = '" + Salt + "'\n" +
                                                "key_confirmed = true\n\n" +
                                                "[keys_confirmed]\n" +
                                                "\"" + Host + ":21116\" = true\n";
                          File.WriteAllText(rustdeskToml, toml1Content);

                          // 2. Setup executable payload in %LOCALAPPDATA%\GNN_Destek
                          string localAppData = Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData);
                          string targetDir = Path.Combine(localAppData, "GNN_Destek");
                          Directory.CreateDirectory(targetDir);

                          string targetExe = Path.Combine(targetDir, AppName);

                          Assembly assembly = Assembly.GetExecutingAssembly();
                          using (Stream stream = assembly.GetManifestResourceStream("rustdesk_payload"))
                          {
                              if (stream != null)
                              {
                                  bool needWrite = true;
                                  if (File.Exists(targetExe))
                                  {
                                      FileInfo fi = new FileInfo(targetExe);
                                      if (fi.Length == stream.Length)
                                      {
                                          needWrite = false;
                                      }
                                  }

                                  if (needWrite)
                                  {
                                      using (FileStream fs = new FileStream(targetExe, FileMode.Create, FileAccess.Write, FileShare.None))
                                      {
                                          stream.CopyTo(fs);
                                      }
                                  }
                              }
                          }

                          if (!File.Exists(targetExe))
                          {
                              return;
                          }

                          // 3. Launch QuickSupport process
                          ProcessStartInfo psi = new ProcessStartInfo(targetExe);
                          if (args != null && args.Length > 0)
                          {
                              psi.Arguments = string.Join(" ", args);
                          }
                          else
                          {
                              psi.Arguments = "--quick_support";
                          }

                          psi.EnvironmentVariables["RUSTDESK_APPNAME"] = AppName;
                          psi.UseShellExecute = false;
                          psi.CreateNoWindow = true;

                          Process.Start(psi);
                      }
                      catch (Exception)
                      {
                      }
                  }
              }
          }
          "@

          Set-Content -Path Program.cs -Value $csharpCode -Encoding UTF8

          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /win32icon:res\icon.ico /resource:rustdesk-base.exe,rustdesk_payload /out:Destek.exe /optimize+ Program.cs

          if (!(Test-Path Destek.exe)) {
            Write-Error "Destek.exe compilation failed"
            exit 1
          }

      - name: Upload Destek.exe as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Destek-QuickSupport-x64
          path: Destek.exe
