name: Build GNNQS.exe (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'libs/**'
      - 'flutter/**'
      - 'res/**'
      - '.github/workflows/build-windows-gnnqs.yml'

permissions:
  contents: write

env:
  VERSION: "1.5.1"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  SCITER_RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
      upload-artifact: true

  build-destek:
    needs: [build-bridge, build-topmost]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply GNN Configuration to hbb_common
        shell: pwsh
        run: |
          Write-Host "Applying GNN server and app name configuration..."
          (Get-Content libs/hbb_common/src/config.rs) `
            -replace 'pub static ref APP_NAME: RwLock<String> = RwLock::new\("RustDesk"\.to_owned\(\)\);', 'pub static ref APP_NAME: RwLock<String> = RwLock::new("GNN_Destek".to_owned());' `
            -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\["rs-ny\.rustdesk\.com"\];', 'pub const RENDEZVOUS_SERVERS: &[&str] = &["130.61.69.181"];' `
            -replace 'pub const RS_PUB_KEY: &str = "OeVuKk5nlHiXp\+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";', 'pub const RS_PUB_KEY: &str = "ARtU1Y9FU869kBMyY0w8Yt3H9hlJHubpZWxUX2Jmzgc=";' `
            | Set-Content libs/hbb_common/src/config.rs

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Copy-Item -Force -Recurse windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
            Expand-Archive usbmmidd_v2.zip -DestinationPath .
            Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
            Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
            Move-Item -Force .\usbmmidd_v2 ./rustdesk
          } catch {
            Write-Host "Ignore usbmmidd optional error: $_"
          }

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
            $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
                Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
                New-Item -ItemType Directory -Force -Path ./rustdesk/drivers
                Move-Item -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                Move-Item -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
              Write-Host "Ignore printer driver optional error."
          }

      - name: Download RustDeskTempTopMostWindow artifact
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Build self-extracted executable (GNNQS.exe)
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          cp -f ./target/release/rustdesk-portable-packer.exe ./SignOutput/GNNQS.exe

      - name: Sign GNNQS.exe with Self-Signed Certificate
        shell: pwsh
        run: |
          Write-Host "Creating Code Signing Certificate for GNN Destek..."
          
          # 1. Create self-signed code signing certificate
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=GNN Bilgi Teknolojileri, O=GNN Destek, C=TR" `
            -KeySpec Signature `
            -KeyExportPolicy Exportable `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)
            
          $certPwd = ConvertTo-SecureString -String "Gnn2922**" -Force -AsPlainText
          
          # 2. Export PFX and public CER
          Export-PfxCertificate -Cert $cert -FilePath ./SignOutput/gnn_codesign.pfx -Password $certPwd | Out-Null
          Export-Certificate -Cert $cert -FilePath ./SignOutput/GNN-RootCA.cer | Out-Null
          Import-Certificate -Cert $cert -CertStoreLocation "Cert:\CurrentUser\Root" | Out-Null
          
          # 3. Locate signtool.exe from Windows Kits
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Write-Host "Found signtool at: $signtool"
          
          # 4. Sign with RFC 3161 Timestamp (DigiCert / Sectigo)
          $timestampUrls = @(
            "http://timestamp.digicert.com",
            "http://timestamp.sectigo.com",
            "http://timestamp.globalsign.com/scripts/timstamp.dll"
          )
          
          $signed = $false
          foreach ($ts in $timestampUrls) {
            Write-Host "Signing with timestamp: $ts"
            & $signtool sign /f ./SignOutput/gnn_codesign.pfx /p "Gnn2922**" /fd sha256 /tr $ts /td sha256 /d "GNN Hizli Destek" /du "https://gnn.tr" ./SignOutput/GNNQS.exe
            if ($LASTEXITCODE -eq 0) {
              $signed = $true
              Write-Host "Code signing and timestamping succeeded!"
              break
            }
          }
          
          if (-not $signed) {
            Write-Warning "Timestamping failed or timed out, falling back to standalone signature..."
            & $signtool sign /f ./SignOutput/gnn_codesign.pfx /p "Gnn2922**" /fd sha256 /d "GNN Hizli Destek" ./SignOutput/GNNQS.exe
          }
          
          # 5. Verify signature
          $sig = Get-AuthenticodeSignature ./SignOutput/GNNQS.exe
          Write-Host "Authenticode Signature Status: $($sig.Status)"
          Write-Host "Signer Certificate: $($sig.SignerCertificate.Subject)"
          
          # 6. Create helper batch script for customers to install the root certificate with 1 click
          $batContent = "@echo off`r`nNET FILE >nul 2>&1`r`nif '%errorlevel%' NEQ '0' (`r`n    powershell -Command `"Start-Process cmd -ArgumentList '/c \`"`%~f0\`"`' -Verb RunAs`"`r`n    exit /b`r`n)`r`necho GNN Guvenlik Sertifikasi Guvenilen Kok Depoya Ekleniyor...`r`ncertutil -addstore -f `"ROOT`" `"`%~dp0GNN-RootCA.cer`"`r`necho.`r`necho Islem basariyla tamamlandi! Artik GNNQS.exe guvenle acilacaktir.`r`npause"
          [System.IO.File]::WriteAllText("$pwd/SignOutput/Sertifika-Yukle.bat", $batContent, [System.Text.Encoding]::GetEncoding("windows-1254"))
          
          # 7. Clean up private pfx from final output
          Remove-Item -Force ./SignOutput/gnn_codesign.pfx

      - name: Upload GNNQS.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNNQS-x64
          path: ./SignOutput/
